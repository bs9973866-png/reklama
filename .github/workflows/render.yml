name: Render REDSHIFT Launcher Ad

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redshift-ad-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Install offline neural voice engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install "piper-tts==1.8.0"
          mkdir -p models public out
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium/ru_RU-dmitri-medium.onnx" \
            --output models/ru_RU-dmitri-medium.onnx
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium/ru_RU-dmitri-medium.onnx.json" \
            --output models/ru_RU-dmitri-medium.onnx.json
          test "$(stat -c%s models/ru_RU-dmitri-medium.onnx)" -gt 50000000
          test -s models/ru_RU-dmitri-medium.onnx.json

      - name: Generate Russian neural voiceover
        run: python scripts/generate_voice.py

      - name: Type-check project
        run: npx tsc --noEmit

      - name: Render MP4
        run: >-
          npx remotion render src/index.ts RedshiftAd
          out/redshift-launcher-ad.mp4
          --codec h264
          --crf 18
          --audio-codec aac

      - name: Verify rendered video
        run: |
          python - <<'PY'
          from pathlib import Path

          video = Path("out/redshift-launcher-ad.mp4")
          if not video.is_file():
              raise SystemExit("Rendered MP4 is missing.")
          size = video.stat().st_size
          with video.open("rb") as stream:
              header = stream.read(12)
          if size < 500_000 or header[4:8] != b"ftyp":
              raise SystemExit(
                  f"MP4 verification failed: size={size}, header={header!r}"
              )
          print(f"Verified MP4 container: {size:,} bytes")
          PY

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: redshift-launcher-ad
          path: out/redshift-launcher-ad.mp4
          if-no-files-found: error
          retention-days: 14
