name: Render RedShift Launcher Ad

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install Remotion browser
        run: npx remotion browser ensure

      - name: Generate Russian voiceover
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install edge-tts
          mkdir -p public out
          .venv/bin/edge-tts \
            --voice ru-RU-DmitryNeural \
            --rate=+4% \
            --text 'Minecraft — это не просто игра. Это твой мир. И запускать его должно быть так же удобно, как играть. RedShift Launcher помогает выбрать нужную версию Minecraft и держать игровые профили под контролем. Хочешь другой геймплей? Настраивай сборку, подбирай моды и создавай собственный игровой опыт. Настрой параметры запуска под себя. Никакой лишней суеты перед тем, как зайти в игру. Открыл лаунчер, выбрал профиль — и можно отправляться навстречу новым приключениям. RedShift Launcher. Скачивай и попробуй. Твой Minecraft начинается здесь.' \
            --write-media public/voice.mp3
          test -s public/voice.mp3

      - name: Type-check project
        run: npx tsc --noEmit

      - name: Render MP4
        run: npx remotion render src/index.ts RedshiftAd out/redshift-launcher-ad.mp4 --codec h264 --crf 18

      - name: Verify rendered video
        run: test -s out/redshift-launcher-ad.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: redshift-launcher-ad
          path: out/redshift-launcher-ad.mp4
          if-no-files-found: error
          retention-days: 14
